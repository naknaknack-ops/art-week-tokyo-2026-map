<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AWT MAP">
<title>ART WEEK TOKYO 2026 会場マップ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: one-screen map app — map fills the screen, a list/detail sheet docks at the bottom on phones and on the left on wide screens. */
:root{
  --bg:#f3f3ef; --surface:#ffffff; --ink:#16171a; --muted:#666a70; --line:#dcdcd5; --chip:#ebebe5;
  --accent:#1d3bd6; --kk:#16171a;
  --a-ginza:#d23c2a; --a-tokyo:#c47a00; --a-roppongi:#7a3ec2; --a-gaienmae:#0f8a6a; --a-omotesando:#1d3bd6; --a-harajuku:#d1408a; --a-daikanyama:#2f8fb8; --a-ikejiri:#6b7d12;
  --f-display:"Familjen Grotesk","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --tile-filter:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121315; --surface:#1b1c1f; --ink:#ececea; --muted:#9a9ea5; --line:#2e3034; --chip:#26282c;
  --accent:#7d93ff; --kk:#f3f3ef;
  --a-ginza:#ff6b57; --a-tokyo:#f0a63a; --a-roppongi:#b588f0; --a-gaienmae:#3cc79f; --a-omotesando:#7d93ff; --a-harajuku:#f57ab6; --a-daikanyama:#5dbde3; --a-ikejiri:#a8c04a;
  --tile-filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) saturate(.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1b1c1f; --ink:#ececea; --muted:#9a9ea5; --line:#2e3034; --chip:#26282c;
  --accent:#7d93ff; --kk:#f3f3ef;
  --a-ginza:#ff6b57; --a-tokyo:#f0a63a; --a-roppongi:#b588f0; --a-gaienmae:#3cc79f; --a-omotesando:#7d93ff; --a-harajuku:#f57ab6; --a-daikanyama:#5dbde3; --a-ikejiri:#a8c04a;
  --tile-filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) saturate(.6);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;}
header{position:relative;background:var(--surface);border-bottom:1px solid var(--line);z-index:800;min-width:0}
.bar{display:flex;align-items:center;gap:10px;min-height:46px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.bar h1{flex:1 1 auto;min-width:0;font-family:var(--f-display);font-weight:700;font-size:15.5px;letter-spacing:-.01em;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 span{color:var(--muted);font-weight:500}
.dates,.dates-m{margin:0;color:var(--muted);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.02em}
.bar .dates{display:none}
.ftoggle{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-size:12.5px;font-weight:500}
.ftoggle[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ftoggle b[hidden]{display:none}
.ftoggle b{font-family:var(--f-mono);font-size:10.5px;font-weight:500;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:#fff;display:inline-grid;place-items:center;padding:0 4px}
.filters{display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.14);padding-block:4px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-direction:column;gap:10px}
header.open .filters{display:flex}
.fdone{display:flex;justify-content:space-between;gap:8px}
.fdone button{height:34px;border-radius:8px;padding:0 14px;cursor:pointer;font-size:13px}
.reset{border:1px solid var(--line);background:var(--surface)}
.done{border:1px solid var(--ink);background:var(--ink);color:var(--surface);font-weight:500;flex:1 1 auto}
.controls{display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
.controls select{flex:1 1 0}
.controls input[type=search]{flex:1 1 100%;min-width:0;height:34px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 10px}
.controls select{height:34px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 6px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:28px;padding:0 11px 0 9px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--ink))}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.7}

main{position:relative;min-height:0;display:grid}
#map{position:absolute;inset:0;background:var(--bg);z-index:0}
.leaflet-tile-pane{filter:var(--tile-filter)}
.leaflet-container{font-family:var(--f-body);background:var(--bg)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
.leaflet-bar a{background:var(--surface)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-zoom{margin-top:calc(10px + env(safe-area-inset-top,0px))!important;margin-right:calc(10px + env(safe-area-inset-right,0px))!important}

.pin{width:var(--s,26px);height:var(--s,26px);border-radius:50%;background:var(--c);color:#fff;border:2px solid var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:transform .15s}
.pin.sel{transform:scale(1.35);outline:2px solid var(--ink);outline-offset:1px}
.pin.dim{opacity:.18;filter:grayscale(1)}
.kkpin{background:var(--kk);color:var(--bg);border:2px solid var(--surface);border-radius:8px;padding:4px 8px;font-family:var(--f-display);font-weight:700;font-size:12px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35);line-height:1.15;text-align:center}
.kkpin small{display:block;font-family:var(--f-mono);font-weight:400;font-size:10px;opacity:.8}
.kkpin.sel{outline:2px solid var(--accent);outline-offset:2px}
.kkpin.dim{opacity:.25}

/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:600;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);display:flex;flex-direction:column;height:58%;transition:height .25s ease;min-height:0}
#sheet[data-size="peek"]{height:118px}
#sheet[data-size="full"]{height:calc(100% - 12px)}
.grab{flex:0 0 auto;border:0;background:none;padding:8px 0 2px;cursor:pointer;display:grid;place-items:center;width:100%}
.grab span{width:40px;height:4px;border-radius:2px;background:var(--line)}
.sheet-head{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:2px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em}
.sheet-head .count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.scroll{flex:1 1 auto;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px)}
.vlist{list-style:none;margin:0;padding:0}
.vitem{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:start;padding-block:11px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.vitem:hover{background:var(--bg)}
.vitem .dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:5px}
.vitem .nm{font-weight:700;font-size:14px;line-height:1.35;min-width:0}
.vitem .sub{grid-column:2;color:var(--muted);font-size:12px;line-height:1.45;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vitem .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:2px}
.empty{padding:24px 16px;color:var(--muted);line-height:1.6}

/* detail */
.detail{padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.back{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:30px;padding:0 12px;cursor:pointer;font-size:12.5px}
.dhead{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);font-weight:500}
.dhead h3{margin:0;font-family:var(--f-display);font-size:20px;line-height:1.25;text-wrap:balance}
.addr{color:var(--muted);font-size:12.5px;line-height:1.5}
.links{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:500}
.btn.solid{background:var(--ink);color:var(--surface)}
.note{font-size:12px;color:var(--muted);line-height:1.6;background:var(--bg);border-radius:8px;padding:10px 12px}
.exs{display:flex;flex-direction:column;gap:10px}
.ex{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ex.off{opacity:.45}
.ex h4{margin:0;font-size:14.5px;line-height:1.4}
.ex .cr{font-size:12.5px;color:var(--muted);line-height:1.5}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;line-height:1.5}
.meta dt{font-family:var(--f-mono);color:var(--muted);font-size:10.5px;letter-spacing:.06em;padding-top:2px}
.meta dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;background:var(--chip);border-radius:4px;padding:2px 6px}
.tag.u30{background:var(--ink);color:var(--surface)}
.ex a.more{font-size:12px;color:var(--accent);text-decoration:none;font-weight:500;align-self:flex-start}
.ex a.more:hover{text-decoration:underline}
.closed{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}

@media (min-width:960px){
  #app{grid-template-rows:auto 1fr}
  main{grid-template-columns:400px 1fr}
  #map{position:relative;inset:auto;grid-column:2}
  #sheet,#sheet[data-size]{position:relative;grid-column:1;grid-row:1;height:auto;border-radius:0;border-top:0;border-right:1px solid var(--line);box-shadow:none}
  .grab{display:none}
  .sheet-head{padding-top:12px}
  header{display:flex;flex-wrap:wrap;align-items:center;column-gap:20px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .bar{padding:0;flex:0 0 auto;min-height:0}
  .bar h1{font-size:19px;flex:0 0 auto}
  .bar .dates{display:block}
  .ftoggle,.dates-m,.fdone{display:none}
  .filters,header.open .filters{display:contents}
  header{row-gap:8px}
  .controls{flex:1 1 360px;max-width:640px;flex-wrap:nowrap}
  .controls input[type=search]{flex:1 1 auto!important}
  .controls select{flex:0 0 auto}
  .chips{flex:1 0 100%}
}
@media (prefers-reduced-motion:reduce){#sheet,.pin{transition:none}}

.locbtn{width:34px;height:34px;display:grid;place-items:center;background:var(--surface);color:var(--ink);border:2px solid rgba(0,0,0,.2);border-radius:4px;cursor:pointer;padding:0;background-clip:padding-box}
.locbtn.on{color:var(--accent)}
.locbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.me{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 1px 6px rgba(0,0,0,.35)}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(56px + env(safe-area-inset-top,0px));z-index:900;background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:12.5px;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgba(0,0,0,.25)}
.vitem .dist{font-family:var(--f-mono);font-size:11px;color:var(--accent);white-space:nowrap}
.leaflet-control-layers{background:var(--surface)!important;color:var(--ink);border:2px solid rgba(0,0,0,.2)!important;border-radius:6px!important;font-family:var(--f-body);font-size:13px}
.leaflet-control-layers-toggle{width:34px!important;height:34px!important;background-size:20px 20px!important}
.leaflet-control-layers-expanded{padding:8px 12px 8px 8px!important}
.leaflet-control-layers label{display:block;padding:4px 0}
.leaflet-control-layers-selector{accent-color:var(--accent)}
.ex .thumb{display:block;margin:-12px -12px 4px;aspect-ratio:2/1;background:var(--chip);border-radius:10px 10px 0 0;overflow:hidden}
.ex .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ex .sum{font-size:13px;line-height:1.65;margin:0;color:var(--ink)}
.srcnote{font-size:11px;color:var(--muted)}
</style>
</head>
<body>


<div id="app">
  <header id="hdr">
    <div class="bar">
      <h1>ART WEEK TOKYO 2026 <span>会場マップ</span></h1>
      <p class="dates">11.04 WED – 11.08 SUN ／ AWT BUS 11.06–08</p>
      <button class="ftoggle" id="ftoggle" aria-expanded="false" aria-controls="filters">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 3h12M3 7h8M5 11h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
        <span>絞り込み</span><b id="fcount" hidden></b>
      </button>
    </div>
    <div class="filters" id="filters">
    <p class="dates-m">11.04 WED – 11.08 SUN ／ AWT BUS 11.06–08</p>
    <div class="controls">
      <input type="search" id="q" placeholder="出展者・会場・展示名で検索" aria-label="検索">

      <select id="genre" aria-label="カテゴリで絞り込み"></select>

</div>

function range(d){
  if(d.endsWith("のみ")){ const x=pd(d.replace("のみ","")); return [x,x]; }
  const [a,b]=d.split("〜"); return [pd(a), b? pd(b) : new Date(2026,10,8)];
}

}

function jaStyle(name){
  return fetch(`https://tiles.openfreemap.org/styles/${name}`).then(r=>r.json()).then(st=>{
    st.layers.forEach(l=>{ const tf=l.layout&&l.layout["text-field"];
      if(tf && JSON.stringify(tf).includes("name")) l.layout["text-field"]=["coalesce",["get","name:ja"],["get","name"],["get","name:latin"]]; });
    return st; });
}
function vectorBase(name){

    else this.addLayer(this._gl); };
  return g;
}

function startLocate(){
  if(!("geolocation" in navigator)){ toast("このブラウザは位置情報に対応していません"); return; }
  if(watching) return; watching=true; loc.btn.classList.add("busy"); firstFix=true;
  map.locate({watch:true,enableHighAccuracy:true,setView:false,maximumAge:10000,timeout:20000});
}
map.on("locationfound",e=>{
  me=e.latlng; loc.btn.classList.remove("busy"); loc.btn.classList.add("on");
  if(!meMarker){ meCircle=L.circle(me,{radius:e.accuracy,color:"#1a73e8",weight:1,opacity:.4,fillOpacity:.12,interactive:false}).addTo(map);
    meMarker=L.marker(me,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16],iconAnchor:[8,8]}),zIndexOffset:2000,interactive:false}).addTo(map); }
  else { meMarker.setLatLng(me); meCircle.setLatLng(me).setRadius(e.accuracy); }
  if(firstFix){ firstFix=false; panTo([me.lat,me.lng],Math.max(map.getZoom(),15)); }
  if(!st.sel) renderList();
});
map.on("locationerror",e=>{
  watching=false; loc.btn.classList.remove("busy");
  toast(e.code===1? "位置情報の利用が許可されていません。ブラウザの設定で許可してください" : "現在地を取得できませんでした");
});
function distM(v){ return me? map.distance(me,[v.lat,v.lng]) : null; }
function fmtDist(m){ const min=Math.max(1,Math.round(m/80)); return (m<1000? Math.round(m/10)*10+"m" : (m/1000).toFixed(1)+"km")+" · 徒歩"+min+"分"; }
function panTo(ll,z){
  if(!wide()){ const p=map.project(ll,z); const h=sheet.getBoundingClientRect().height; map.flyTo(map.unproject(p.add([0,h/2]),z),z,{duration:.5}); }
  else map.flyTo(ll,z,{duration:.5});
}

// ---- sheet
const sheet=document.getElementById("sheet"), scroller=document.getElementById("scroll");
const wide=()=>matchMedia("(min-width:960px)").matches;
document.getElementById("grab").onclick=()=>{ const s=sheet.dataset.size; sheet.dataset.size = s==="peek"?"half": s==="half"?"full":"peek"; setTimeout(()=>map.invalidateSize(),260); };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderList(){
  let rows=V.map(v=>[v,visible(v)]).filter(([,x])=>x.length);
  if(me) rows=rows.slice().sort((a,b)=>distM(a[0])-distM(b[0]));
  const n=rows.reduce((a,[,x])=>a+x.length,0);
  document.getElementById("sh-title").textContent = (st.day===""? "会場一覧" : `${fmt(DAYS[+st.day])} に開いている会場`) + (me?"（近い順）":"");
  document.getElementById("sh-count").textContent = `${rows.length}会場 · ${n}展示`;
  if(!rows.length){ scroller.innerHTML=`<p class="empty">条件に合う展示がありません。ルート・日付・カテゴリの絞り込みをゆるめてください。</p>`; return; }
  scroller.innerHTML = `<ul class="vlist">`+rows.map(([v,x])=>`<li><button class="vitem" data-k="${esc(v.k)}" style="--c:${v.k==="KK"?"var(--kk)":cvar(v.area)}">
    <span class="dot"></span><span class="nm">${esc(v.name)}</span><span class="n">${x.length}</span>
    <span class="sub">${me?`<span class="dist">${fmtDist(distM(v))}</span> · `:""}${esc(v.area)} · ${esc(x.map(e=>e.t).slice(0,3).join(" ／ "))}${x.length>3?" ほか":""}</span></button></li>`).join("")+`</ul>`;
}
scroller.addEventListener("click",e=>{
  const b=e.target.closest(".vitem"); if(b){ select(b.dataset.k,true); return; }
  if(e.target.closest(".back")){ st.sel=null; render(); }
});

function renderDetail(v){
  const vis=new Set(visible(v).map(e=>e.id));
  const list=v.ex.filter(exMatch);
  const gq=encodeURIComponent(v.k==="KK"?"東京交通会館":v.addr.replace(/（.*?）/g,"").split(" ")[0]);
  const color=v.k==="KK"?"var(--kk)":cvar(v.area);
  document.getElementById("sh-title").textContent="会場の詳細";
  document.getElementById("sh-count").textContent=`${list.length}展示`;
  scroller.innerHTML=`<div class="detail" style="--c:${color}">
    <button class="back">← 一覧に戻る</button>
    <div class="dhead"><span class="eyebrow">${esc(v.area)}</span><h3>${esc(v.name)}</h3><div class="addr">${esc(v.addr)}</div></div>
    <div class="links"><a class="btn solid" href="https://www.google.com/maps/dir/?api=1&destination=${v.lat},${v.lng}&travelmode=walking" target="_blank" rel="noopener">Googleマップで経路</a>
    ${v.k==="KK"?`<a class="btn" href="https://artsticker.app/events/155300" target="_blank" rel="noopener">チケット（ArtSticker）</a>`:""}</div>
    ${v.k==="KK"?`<p class="note">会期は 10.30–11.3 の5日間のみ。10:00–19:00（10/30は12:00から、11/3は17:00まで）。有料：1日券 前売3,000円／当日3,500円、学生 前売1,000円／当日1,500円。入口は東京交通会館のとなり。地図上の線はおおよその位置です。</p>`:""}
    <p class="srcnote">画像は公式サイトより。説明は公式ページの内容を要約したものです。</p>
    <div class="exs">${list.map(e=>`<article class="ex ${vis.has(e.id)?"":"off"}">
      ${e.img?`<a class="thumb" href="${BASE}${e.id}/" target="_blank" rel="noopener"><img src="${IMG}${encodeURI(e.img)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></a>`:""}
      <h4>${esc(e.t)}</h4>
      ${e.s?`<p class="sum">${esc(e.s)}</p>`:""}
      
      <dl class="meta"><dt>AREA</dt><dd>${esc(e.c)}</dd><dt>BUS</dt><dd>${esc(e.h)}</dd>${e.v!==v.name&&v.k!=="KK"?`<dt>VENUE</dt><dd>${esc(e.v)}</dd>`:""}</dl>
      <div class="tags">${e.g.map(g=>`<span class="tag ${g==="UNDER30"?"u30":""}">${g}</span>`).join("")}</div>
      ${vis.has(e.id)?"":`<span class="closed">選択した日は会期外です</span>`}
      <a class="more" href="${BASE}${e.id}/" target="_blank" rel="noopener">公式ページで詳しく見る →</a>
    </article>`).join("")}</div>
  </div>`;
  scroller.scrollTop=0;
}

function select(k,fromList){
  st.sel=k; const v=V.find(x=>x.k===k);
  if(!wide() && sheet.dataset.size==="peek") sheet.dataset.size="half";
  const z=Math.max(map.getZoom(), k==="KK"?16:16);
  if(!wide()){
    // keep the pin above the sheet
    const p=map.project([v.lat,v.lng],z); const h=sheet.getBoundingClientRect().height;
    map.flyTo(map.unproject(p.add([0,h/2]),z),z,{duration:.5});
  } else map.flyTo([v.lat,v.lng],z,{duration:.5});
  render();
}

function render(fit){
  paintMarkers(); updateBadge();
  if(st.sel){ renderDetail(V.find(x=>x.k===st.sel)); } else renderList();
  if(fit && st.areas.size){
    const pts=V.filter(v=>st.areas.has(v.area)).map(v=>[v.lat,v.lng]);
    if(pts.length) map.flyToBounds(pts,{padding:[40,40],maxZoom:16,paddingBottomRight:[0, wide()?0:sheet.getBoundingClientRect().height]});
  }
}
map.whenReady(()=>{
  const pts=V.map(v=>[v.lat,v.lng]);
  map.fitBounds(pts,{paddingTopLeft:[20,20],paddingBottomRight:[20, wide()?20:sheet.getBoundingClientRect().height+10]});
  render();
});
map.on("zoomend moveend",paintMarkers);
map.on("click",()=>setOpen(false));
sheet.addEventListener("pointerdown",()=>{ if(!wide()) setOpen(false); });
addEventListener("resize",()=>map.invalidateSize());
</script>

</body>
